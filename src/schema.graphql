type JWT @jwt {
    id: String
}
type User @authorization(filter: [{ where: { node: { userId: "$jwt.id" } } }]) {
    userId: String! @unique
    adminAccess: [Tenant!]!
        @relationship(type: "ADMIN_IN", direction: OUT, aggregate: false)
}

type Tenant
    @authorization(
        validate: [{ where: { node: { admins: { userId: "$jwt.id" } } } }]
    ) {
    id: ID! @id
    admins: [User!]!
        @relationship(type: "ADMIN_IN", direction: IN, aggregate: false)
    settings: Settings!
        @relationship(type: "HAS_SETTINGS", direction: OUT, aggregate: false)
}

type Settings
    @authorization(
        validate: [
            { where: { node: { tenant: { admins: { userId: "$jwt.id" } } } } }
        ]
    ) {
    tenant: Tenant!
        @relationship(type: "HAS_SETTINGS", direction: IN, aggregate: false)
    extendedOpeningHours: [OpeningDay!]!
        @relationship(
            type: "HAS_OPENING_HOURS"
            direction: OUT
            aggregate: false
        )
}

type OpeningDay
    @authorization(
        validate: [
            {
                where: {
                    node: {
                        settings: { tenant: { admins: { userId: "$jwt.id" } } }
                    }
                }
            }
        ]
    ) {
    settings: Settings!
        @relationship(
            type: "HAS_OPENING_HOURS"
            direction: IN
            aggregate: false
        )
    date: Date
    open: [OpeningHoursInterval!]!
        @relationship(
            type: "HAS_OPEN_INTERVALS"
            direction: OUT
            aggregate: false
        )
}

type OpeningHoursInterval
    @authorization(
        validate: [
            {
                where: {
                    node: {
                        openingDay: {
                            settings: {
                                tenant: { admins: { userId: "$jwt.id" } }
                            }
                        }
                    }
                }
            }
        ]
    ) {
    openingDay: OpeningDay
        @relationship(
            type: "HAS_OPEN_INTERVALS"
            direction: IN
            aggregate: false
        )
    name: String
}

extend schema @authentication @query(read: true, aggregate: false)
